name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fallow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: fallow-rs/fallow@v2
        with:
          command: audit
          gate: new-only
          fail-on-issues: true

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run format-and-lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun test --timeout 30000

      - name: Golden fixture parity
        if: ${{ hashFiles('fixtures/**/achar.fixture.json') != '' }}
        run: bun packages/cli/src/index.ts test fixtures --all
