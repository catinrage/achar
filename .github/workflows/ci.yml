name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run format-and-lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun run test

      - name: Golden fixture parity
        if: ${{ hashFiles('fixtures/**/achar.fixture.json') != '' }}
        run: bun packages/cli/src/index.ts test fixtures --all
